<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | ProStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <div class="text-center mb-8">
        <a href="index.html" class="text-3xl font-bold text-blue-600"
          >ProStore</a
        >
        <p class="text-gray-500 mt-2">Create an account to start shopping.</p>
      </div>

      <form id="registerForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1"
            >Full Name</label
          >
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400"
              ><i class="fa-solid fa-user"></i
            ></span>
            <input
              type="text"
              id="name"
              placeholder="John Doe"
              class="w-full pl-10 pr-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1"
            >Email Address</label
          >
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400"
              ><i class="fa-solid fa-envelope"></i
            ></span>
            <input
              type="email"
              id="email"
              placeholder="name@example.com"
              class="w-full pl-10 pr-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1"
            >Password</label
          >
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400"
              ><i class="fa-solid fa-lock"></i
            ></span>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200"
        >
          Create Account
        </button>
      </form>

      <p class="text-center mt-8 text-gray-600">
        Already have an account?
        <a href="login.html" class="text-blue-600 font-bold hover:underline"
          >Login</a
        >
      </p>

      <div class="mt-6 text-center">
        <a href="index.html" class="text-sm text-gray-400 hover:text-gray-600"
          ><i class="fa-solid fa-arrow-left mr-1"></i> Back to Home</a
        >
      </div>
    </div>

    <script>
      // window.API_URL আমাদের assets/js/config.js থেকে আসছে
      const API_ENDPOINT = `${window.API_URL}/users/register`;

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            // dynamic API_ENDPOINT ব্যবহার করছি
            const response = await fetch(API_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json();

            if (response.ok) {
              localStorage.setItem("userInfo", JSON.stringify(data));
              alert("Registration Successful!");
              window.location.href = "index.html";
            } else {
              alert(data.message || "Registration failed.");
            }
          } catch (error) {
            console.error("Error:", error);
            // যদি এই এলার্টটি আসে, তার মানে config.js ঠিকমতো লোড হয়নি অথবা URL ভুল
            alert(
              "Connection to server failed. Please check if you updated the URL.",
            );
          }
        });
    </script>
  </body>
</html>
