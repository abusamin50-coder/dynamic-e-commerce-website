<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ProStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.history.back()" class="text-gray-400 hover:text-blue-600 transition text-xl">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <a href="index.html" class="text-2xl font-bold text-blue-600">ProStore</a>
        </div>
        <div class="flex items-center gap-6">
            <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium">Home</a>
            <a href="cart.html" class="text-gray-600 hover:text-blue-600 relative">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
            </a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-10">
        <div class="max-w-5xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                
                <div class="md:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm text-center">
                        <div class="w-24 h-24 bg-gray-200 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-white shadow-inner">
                            <i class="fa-solid fa-user text-4xl text-gray-400"></i>
                        </div>
                        <h2 id="display-name" class="font-bold text-xl text-gray-900">Loading...</h2>
                        <div id="status-container" class="mt-1 mb-4">
                            <span id="user-role-badge" class="px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border"></span>
                        </div>
                        <div class="border-t pt-4 space-y-2">
                            <button class="w-full text-left px-4 py-2 bg-blue-50 text-blue-600 rounded-lg font-bold text-sm">My Profile</button>
                            <button onclick="logout()" class="w-full text-left px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg font-bold text-sm mt-4">Logout</button>
                        </div>
                    </div>
                    <div id="admin-management-card" class="hidden">
                        <div class="bg-gray-900 p-5 rounded-2xl text-white shadow-xl">
                            <a href="admin.html" class="block w-full bg-blue-600 py-2 rounded-lg font-bold text-center">Open Dashboard</a>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-3 bg-white p-8 rounded-2xl border shadow-sm">
                    <h2 class="text-2xl font-black text-gray-900 mb-6">Profile Settings</h2>
                    <form id="profileForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="text-[10px] font-black text-gray-400 uppercase">Full Name</label>
                            <input type="text" id="userName" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-400" required></div>
                            <div><label class="text-[10px] font-black text-gray-400 uppercase">Email (Locked)</label>
                            <input type="email" id="userEmail" class="w-full px-4 py-3 border bg-gray-100 rounded-xl cursor-not-allowed" disabled></div>
                        </div>
                        <div class="bg-blue-50/50 p-6 rounded-2xl border border-blue-100 space-y-4">
                            <h3 class="font-bold text-blue-800 text-sm">Update Password</h3>
                            <input type="password" id="currentPassword" placeholder="Current Password (Required for changes)" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="password" id="newPassword" placeholder="New Password" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                                <input type="password" id="confirmPassword" placeholder="Confirm New Password" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                        </div>
                        <div class="flex justify-end pt-4">
                            <button type="submit" class="bg-gray-900 text-white px-12 py-3 rounded-xl font-bold hover:bg-black transition">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const userInfo = JSON.parse(localStorage.getItem('userInfo'));
        const API_URL = 'http://localhost:5000/api/users';
        if (!userInfo) window.location.href = 'login.html';

        function initProfile() {
            document.getElementById('display-name').innerText = userInfo.name;
            document.getElementById('userName').value = userInfo.name;
            document.getElementById('userEmail').value = userInfo.email;
            const badge = document.getElementById('user-role-badge');
            if(userInfo.isAdmin) {
                badge.innerText = "Admin";
                badge.className += " bg-blue-600 text-white border-blue-600";
                document.getElementById('admin-management-card').classList.remove('hidden');
            } else {
                badge.innerText = "User";
                badge.className += " bg-gray-100 text-gray-600 border-gray-200";
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!currentPassword) { alert('Please enter your current password to save changes.'); return; }
            if (newPassword && newPassword !== confirmPassword) { alert('New passwords do not match.'); return; }

            const updateData = { name: document.getElementById('userName').value, currentPassword };
            if (newPassword) updateData.newPassword = newPassword;

            try {
                const res = await fetch(`${API_URL}/profile`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${userInfo.token}` 
                    },
                    body: JSON.stringify(updateData)
                });

                const data = await res.json();

                if (res.ok) {
                    // CRITICAL FIX: Save the NEW token and data sent by server
                    localStorage.setItem('userInfo', JSON.stringify(data)); 
                    alert('Profile updated successfully! Server now recognizes your new credentials.');
                    window.location.reload();
                } else {
                    alert(data.message || 'Update failed');
                }
            } catch (error) {
                alert('Connection error');
            }
        });

        function logout() {
            localStorage.removeItem(`cart_${userInfo.email}`);
            localStorage.removeItem('userInfo');
            window.location.href = 'index.html';
        }
        initProfile();
    </script>
</body>
</html>
