<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | ProStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .status-badge-cart {
        position: absolute;
        top: 4px;
        right: 4px;
        padding: 2px 6px;
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
        border-radius: 4px;
        z-index: 20;
      }
      .fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
      <div
        class="container mx-auto px-4 py-3 flex items-center justify-between"
      >
        <div class="flex items-center gap-4">
          <button
            onclick="window.history.back()"
            class="text-gray-400 hover:text-blue-600 transition text-xl"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <a href="index.html" class="text-2xl font-bold text-blue-600"
            >ProStore</a
          >
        </div>
        <div class="flex items-center space-x-6">
          <a href="cart.html" class="relative text-blue-600">
            <i class="fa-solid fa-cart-shopping text-xl"></i>
            <span
              id="cart-count-nav"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full hidden"
              >0</span
            >
          </a>
        </div>
      </div>
    </nav>

    <!-- CART CONTENT -->
    <main class="container mx-auto px-4 py-12 flex-grow" id="cart-main-section">
      <h1 class="text-3xl font-black text-gray-900 mb-8">Shopping Cart</h1>
      <div id="cart-wrapper" class="flex flex-col lg:flex-row gap-8">
        <div class="flex-1 space-y-4" id="cart-items-container"></div>
        <div class="w-full lg:w-96">
          <div class="bg-white p-8 rounded-2xl border shadow-sm sticky top-24">
            <h2 class="text-xl font-bold mb-6">Summary</h2>
            <div
              class="flex justify-between font-black text-2xl text-gray-900 mb-8"
            >
              <span>Total</span><span id="total-price">$0.00</span>
            </div>
            <button
              id="checkout-btn"
              onclick="proceedToCheckout()"
              class="w-full bg-blue-600 text-white py-4 rounded-xl font-black hover:bg-blue-700 transition shadow-lg shadow-blue-200"
            >
              Proceed to Checkout
            </button>
            <p
              id="stock-warning"
              class="text-red-500 text-xs mt-4 text-center hidden font-bold"
            >
              Remove out of stock items to continue.
            </p>
          </div>
        </div>
      </div>
      <div
        id="empty-cart"
        class="hidden text-center py-20 bg-white rounded-2xl border"
      >
        <i class="fa-solid fa-cart-arrow-down text-4xl text-gray-200 mb-6"></i>
        <h2 class="text-xl font-bold mb-4">Your cart is empty</h2>
        <a
          href="index.html"
          class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold"
          >Go Shopping</a
        >
      </div>
    </main>

    <!-- SUCCESS SCREEN -->
    <main
      id="success-screen"
      class="hidden container mx-auto px-4 py-20 flex-grow text-center fade-in"
    >
      <div class="bg-white p-12 rounded-3xl border shadow-sm max-w-2xl mx-auto">
        <i class="fa-solid fa-circle-check text-green-500 text-6xl mb-6"></i>
        <h1 class="text-4xl font-black mb-4">Order Placed Successfully!</h1>
        <p class="text-gray-500 mb-10">
          We have received your order. Continue shopping for more.
        </p>
        <a
          href="index.html"
          class="bg-blue-600 text-white px-12 py-4 rounded-full font-black hover:bg-blue-700 transition"
          >Continue Shopping</a
        >
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-white pt-20 pb-10">
      <div class="container mx-auto px-4 text-center">
        <a href="index.html" class="text-3xl font-black text-blue-500"
          >ProStore</a
        >
        <p class="mt-4 text-gray-500 text-sm">
          &copy; 2024 ProStore E-Commerce. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Inside the script tag, update proceedToCheckout function -->
    <script>
    const userInfo = JSON.parse(localStorage.getItem("userInfo"));
    // Ensure the user is logged in
    if (!userInfo) window.location.href = 'login.html';

    const cartKey = `cart_${userInfo.email}`;

    function updateCartUI() {
        const cartItems = JSON.parse(localStorage.getItem(cartKey)) || [];
        const container = document.getElementById('cart-items-container');
        const wrapper = document.getElementById('cart-wrapper');
        const empty = document.getElementById('empty-cart');
        const totalEl = document.getElementById('total-price');

        if (cartItems.length === 0) {
            wrapper.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        let total = 0;
        container.innerHTML = cartItems.map((item, index) => {
            total += item.price * item.qty;
            const isOutOfStock = item.countInStock <= 0;
            
            return `
                <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row items-center gap-6 relative">
                    ${isOutOfStock ? '<div class="status-badge-cart bg-red-600 text-white">Out of Stock</div>' : ''}
                    <img src="${item.image}" class="w-24 h-24 object-cover rounded-xl ${isOutOfStock ? 'grayscale' : ''}">
                    <div class="flex-1 text-center md:text-left">
                        <h3 class="font-bold text-lg">${item.name}</h3>
                        <p class="text-blue-600 font-black text-xl">$${item.price}</p>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-50 p-2 rounded-xl border">
                        <button onclick="updateQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition"><i class="fa-solid fa-minus text-xs"></i></button>
                        <span class="font-bold w-6 text-center">${item.qty}</span>
                        <button onclick="updateQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition"><i class="fa-solid fa-plus text-xs"></i></button>
                    </div>
                    <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
        }).join('');

        totalEl.innerText = `$${total.toFixed(2)}`;
        
        // Check if any item is out of stock to disable checkout
        const hasOutOfStock = cartItems.some(item => item.countInStock <= 0);
        const checkoutBtn = document.getElementById('checkout-btn');
        const warning = document.getElementById('stock-warning');

        if (hasOutOfStock) {
            checkoutBtn.disabled = true;
            checkoutBtn.classList.add('opacity-50', 'cursor-not-allowed');
            warning.classList.remove('hidden');
        } else {
            checkoutBtn.disabled = false;
            checkoutBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            warning.classList.add('hidden');
        }
    }

    function updateQty(index, change) {
        let cartItems = JSON.parse(localStorage.getItem(cartKey));
        cartItems[index].qty += change;
        if (cartItems[index].qty < 1) cartItems[index].qty = 1;
        localStorage.setItem(cartKey, JSON.stringify(cartItems));
        updateCartUI();
    }

    function removeItem(index) {
        let cartItems = JSON.parse(localStorage.getItem(cartKey));
        cartItems.splice(index, 1);
        localStorage.setItem(cartKey, JSON.stringify(cartItems));
        updateCartUI();
    }

    async function proceedToCheckout() {
        const cartItems = JSON.parse(localStorage.getItem(cartKey)) || [];
        const totalPrice = cartItems.reduce((acc, item) => acc + (item.price * item.qty), 0);

        try {
            // Use window.API_URL from config.js
            const res = await fetch(`${window.API_URL}/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${userInfo.token}`
                },
                body: JSON.stringify({ orderItems: cartItems, totalPrice })
            });

            if (res.ok) {
                localStorage.removeItem(cartKey);
                document.getElementById('cart-main-section').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert('Checkout failed. Please try again.');
            }
        } catch (err) {
            console.error('Checkout error:', err);
            alert('Connection to server failed.');
        }
    }

    // Initial Load
    updateCartUI();
</script>
  </body>
</html>
